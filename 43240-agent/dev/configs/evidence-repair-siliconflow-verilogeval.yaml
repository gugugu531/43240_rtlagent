schema_version: 1
workflow:
  type: evidence_repair
services:
  model:
    backend: openai
    model: Qwen/Qwen3-8B
    base_url: https://api.siliconflow.cn/v1
    api_key_env: LLM_API_KEY
    timeout_s: 180
runtime:
  deadline_s: 360
  reserve_s: 20
  recording:
    level: full
experiment:
  tasks:
    root: ../../../tasks
    list: verilogeval.txt
    exclude: exclude.txt
  modes: [agent]
  samples: 1
  solve_jobs: 4
  metric_jobs: 4
  metrics: [runtime, model, judge]
  tag: siliconflow-qwen3-8b-a-verilogeval
