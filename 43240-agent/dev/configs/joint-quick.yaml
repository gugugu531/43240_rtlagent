schema_version: 1
workflow:
  type: single_generate
services:
  model:
    backend: openai
    model: Qwen3-8B
    base_url: http://127.0.0.1:18000/v1
    timeout_s: 300
runtime:
  deadline_s: 360
  reserve_s: 20
experiment:
  tasks:
    root: ../../../tasks
    list: quick.txt
    exclude: exclude.txt
  modes: [agent, baseline]
  samples: 1
  solve_jobs: 4
  metric_jobs: 4
  metrics: [runtime, model, judge]
  tag: joint-quick
