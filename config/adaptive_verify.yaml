# 普通可配置预算；没有独立研究模式。参数覆盖见工作流的 AdaptiveParameters。
workflow: adaptive_verify
runtime:
  deadline_s: 9600
  reserve_s: 120
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8000/v1
    timeout_s: 1200
    max_model_len: 32768
    structured_outputs: false
  # 小模型候选，默认关闭并回落到主模型。HF revision a171280d7f001fef819e90218e008a887f1292c7，license 为空，权重约 6.2 GB F32；
  # 启用前须确认许可证、验证 flat plan 格式，并在 manifest.json 的
  # auxiliary_models 与 model/MODEL.md 中声明，同时确认 32 GB 总预算。
  profiles:
    small: {enabled: false, model: Nellyw888/VeriReason-Qwen2.5-1.5b-RTLCoder-Verilog-GRPO-reasoning-tb}
    large: {enabled: false}
