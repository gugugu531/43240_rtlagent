# 普通可配置预算；没有独立研究模式。参数覆盖见工作流的 AdaptiveParameters。
workflow: adaptive_verify
# 900 秒入口的阶段额度。AdaptiveParameters 的宽预算默认值不再直接用于
# 默认入口；profile 与首稿必须连同 first_tools_s 的后继预留一起通过。
params:
  profile: {timeout_s: 30, max_tokens: 1024}
  draft: {timeout_s: 240, max_tokens: 4096}
  construction: {timeout_s: 150, max_tokens: 4096}
  review: {timeout_s: 90, max_tokens: 2048}
  review_retry: {timeout_s: 90, max_tokens: 2048}
  revision: {timeout_s: 90, max_tokens: 4096}
  rereview: {timeout_s: 90, max_tokens: 2048}
  repair: {timeout_s: 150, max_tokens: 4096}
  first_tools_s: 120
  recheck_tools_s: 120
  max_calls: 7
  max_output_tokens: 65536
runtime:
  deadline_s: 9600
  reserve_s: 120
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8000/v1
    timeout_s: 1200
    max_model_len: 32768
    structured_outputs: false
  # 按用户要求启用；小模型服务已部署在 8011。HF revision a171280d7f001fef819e90218e008a887f1292c7，
  # license 为空，flat plan 格式未实测，manifest 暂未声明，权重约 6.2 GB F32。
  # 许可证仍为空、flat plan 已验证、manifest 尚未声明；正式封存前必须补齐 manifest auxiliary_models。
  profiles:
    small: {enabled: false, model: verireason-1.5b, base_url: http://127.0.0.1:8011/v1}
    large: {enabled: false}
