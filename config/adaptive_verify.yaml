# 普通可配置预算；没有独立研究模式。参数覆盖见工作流的 AdaptiveParameters。
workflow: adaptive_verify
runtime:
  deadline_s: 9600
  reserve_s: 120
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8000/v1
    timeout_s: 1200
    max_model_len: 32768
    structured_outputs: false
