# 完整组件装配配置；Python定义流程，YAML声明类、参数和依赖。
schema_version: 2
workflow: workflow
components:
  workflow:
    kind: workflow
    class: agent.workflows.spec_repair:SpecTestRepair
    params:
      max_tokens: 8192
      timeout_s: 300.0
    inject:
      generate: generate
      extract: extract
      interface: interface
      lint: lint
      synth: synth
      alternative: alternative
      plan_node: plan
      behavior: behavior
  generate:
    kind: node
    class: agent.nodes.generate:GenerateNode
    params:
      max_tokens: 8192
      temperature: 0.0
      timeout_s: 300.0
      prompt_style: repair
      use_skills: false
      minimum_s: 0.0
      top_p: 1.0
    inject: {}
  extract:
    kind: node
    class: agent.nodes.extract:ExtractNode
    params: {}
    inject: {}
  interface:
    kind: node
    class: agent.nodes.check:InterfaceNode
    params: {}
    inject:
      tool: interface_tool
  interface_tool:
    kind: tool
    class: agent.tools.interface:InterfaceCheckTool
    params: {}
    inject: {}
  lint:
    kind: node
    class: agent.nodes.check:LintNode
    params:
      timeout_s: 45.0
      minimum_s: 0.0
    inject:
      tool: lint_tool
  lint_tool:
    kind: tool
    class: agent.tools.vivado:VivadoLintTool
    params: {}
    inject: {}
  synth:
    kind: node
    class: agent.nodes.check:SynthNode
    params:
      timeout_s: 60.0
      minimum_s: 0.0
    inject:
      tool: synth_tool
  synth_tool:
    kind: tool
    class: agent.tools.vivado:VivadoSynthTool
    params: {}
    inject: {}
  alternative:
    kind: node
    class: agent.nodes.generate:GenerateNode
    params:
      max_tokens: 8192
      temperature: 0.4
      timeout_s: 300.0
      prompt_style: repair
      use_skills: false
      minimum_s: 0.0
      top_p: 1.0
    inject: {}
  plan:
    kind: node
    class: agent.nodes.behavior:TestPlanNode
    params:
      max_tokens: 4096
      timeout_s: 90.0
      top_p: 1.0
    inject: {}
  behavior:
    kind: node
    class: agent.nodes.behavior:BehaviorNode
    params:
      timeout_s: 45.0
    inject:
      tool: behavior_tool
  behavior_tool:
    kind: tool
    class: agent.tools.behavior:BehaviorCheckTool
    params: {}
    inject: {}
services:
  model:
    backend: mock
    model: mock-model
    base_url: ''
    api_key_env: LLM_API_KEY
    timeout_s: 180.0
    tokenizer_dir: null
    context_limit: null
    strict_context: false
    token_total_limit: null
    token_output_limit: null
    enable_thinking: null
    tokenizer_sha256: null
    template_sha256: null
  tools:
    part: xczu3eg-sbva484-1-e
    bin_dir: null
    temp_dir: /tmp
    keep_work: false
runtime:
  deadline_s: 900
  reserve_s: 20
  initial_state: null
  recording:
    level: full
    root: null
