# Pinned English K=1 exact RAG shadow preset; no Skill injection, not the default.
workflow: repair_loop
params: {max_rounds: 2}
nodes:
  generate:
    use: rtl_generate
    params:
      max_tokens: 4096
      temperature: 0.2
      timeout_s: 180
      skill_ids: []
      skill_phases: [generate, repair]
      rag_mode: shadow
      retrieval:
        strategy: exact
        fallback: empty
        release_id: framework-v1-en.1
        release_sha256: 8474fee979a28257db2d1ce02130a74bf2c11fd6271c9212546723157ed4cb54
        policy_sha256: d303209fd583c6e9c74e08d09e2f59b4a2a74ee4f38292089c5fe34f30c5807a
      knowledge_max_tokens: 2048
  check: {use: rtl_checks, params: {stages: [interface, lint, synth]}}
tools:
  interface: {use: interface_check}
  lint: {use: vivado_lint, params: {timeout_s: 300}}
  synth: {use: vivado_synth, params: {timeout_s: 300}}
services:
  model: {backend: mock}
runtime:
  deadline_s: 900
  reserve_s: 20
  recording: {level: full}
