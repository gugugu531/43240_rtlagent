# guided_verify 大模型配置：planner 也使用主模型，不启用 8011 小模型。
# 该配置用于 Qwen3.8-27B 单模型对照；小模型 profile 保持关闭。

workflow: guided_verify
params:
  retrieval_mode: "off"
  retrieval_strategy: bm25
  planner: {timeout_s: 300, max_tokens: 4096}
  solve: {timeout_s: 300, max_tokens: 8192}
  checker: {timeout_s: 300, max_tokens: 8192}
  max_cases: 4
  max_steps_per_case: 8
  init_cycles: 2
  knowledge_candidates: 5
  knowledge_select: 3
  max_calls: 8
  max_output_tokens: 65536
  first_tools_s: 120
  recheck_tools_s: 120
runtime:
  deadline_s: 900
  reserve_s: 60
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8000/v1
    model: qwen38-27b-q4-k-m
    tokenizer_protocol: llama_cpp
    max_model_len: 65536
    timeout_s: 300
    structured_outputs: false
  profiles:
    small:
      enabled: false
      model: verireason-1.5b
      base_url: http://127.0.0.1:8011/v1
      timeout_s: 120
    large: {enabled: false}
