# guided_verify 开发配置：小模型在 8011，主模型在 8010。
# 小模型权重、许可证和 flat plan 行为须先验证；未就绪时不要把该配置用于正式投题。
workflow: guided_verify
params:
  planner: {timeout_s: 60, max_tokens: 512}
  solve: {timeout_s: 240, max_tokens: 4096}
  checker: {timeout_s: 180, max_tokens: 2048}
  adjudicate: {timeout_s: 120, max_tokens: 1024}
  structure_repair_limit: 1
  behavior_repair_limit: 1
  checker_rebuild_limit: 1
  adjudicate_limit: 2
  max_cases: 4
  max_steps_per_case: 8
  init_cycles: 2
  knowledge_candidates: 5
  knowledge_select: 3
  max_calls: 8
  max_output_tokens: 65536
  first_tools_s: 120
  recheck_tools_s: 120
  submission_policy: last_written
runtime:
  deadline_s: 900
  reserve_s: 60
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8010/v1
    model: qwen38-27b-q4-k-m
    tokenizer_protocol: llama_cpp
    max_model_len: 65536
    timeout_s: 300
    structured_outputs: false
  profiles:
    small:
      enabled: true
      model: verireason-1.5b
      base_url: http://127.0.0.1:8011/v1
      timeout_s: 120
    large: {enabled: false}
