# 默认流程：规划、生成和独立检查均使用 8000 的 Qwen3.8-27B。
# 每个阶段重新构造 messages，不续接其他阶段的聊天历史；RAG 关闭。
workflow: guided_verify
params:
  retrieval_mode: "off"
  retrieval_strategy: bm25
  planner: {timeout_s: 90, max_tokens: 4096}
  solve: {timeout_s: 300, max_tokens: 16384}
  checker: {timeout_s: 180, max_tokens: 8192}
  max_cases: 4
  max_steps_per_case: 8
  init_cycles: 2
  knowledge_candidates: 5
  knowledge_select: 3
  max_calls: 8
  max_output_tokens: 65536
  minimum_request_s: 20
  solve_minimum_s: 120
  first_tools_s: 120
  recheck_tools_s: 120
runtime:
  deadline_s: 900
  reserve_s: 60
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8000/v1
    model: qwen38-27b-q4-k-m
    tokenizer_protocol: llama_cpp
    max_model_len: 65536
    timeout_s: 300
    structured_outputs: false
  profiles:
    small: {enabled: false}
    large: {enabled: false}
