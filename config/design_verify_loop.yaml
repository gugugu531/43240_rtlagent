# 正式时限最多900秒；研究验证另建记录。
workflow: design_verify_loop
params: {max_rounds: 3, checker_revisions: 1, unchanged_retries: 1}
nodes:
  generate: {use: rtl_generate, params: {max_tokens: 16384, temperature: 0.0, top_p: 1.0, timeout_s: 840}}
  plan: {use: design_plan, params: {plan_retries: 1, plan_max_tokens: 4096, review_max_tokens: 4096}}
  build_suite: {use: build_suite, params: {construction_retries: 1, generation_max_tokens: 8192, review_max_tokens: 4096, reserve_s: 120}}
tools:
  interface: {use: interface_check}
  lint: {use: vivado_lint}
  synth: {use: vivado_synth}
  functional: {use: functional_sim}
services:
  model: {backend: mock}
runtime:
  deadline_s: 900
  reserve_s: 20
  recording: {level: full}
