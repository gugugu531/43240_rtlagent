# 开发验证用的 900 秒候选配置，对应 2026-10-28 云端真实冒烟。
# 不是正式 manifest 模型声明：这里连接 8010 的 llama.cpp Qwen3.8-27B 开发服务。
# profile 30 秒实测 17.5 秒；更长题面建议提高到 90 秒后复测。
# 检查器构造在该次运行中仍因后继预留不足未发送，正式使用前须重新校准。
workflow: adaptive_verify
params:
  tool_steps: 2
  profile: {timeout_s: 30, max_tokens: 1024}
  draft: {timeout_s: 240, max_tokens: 4096}
  construction: {timeout_s: 150, max_tokens: 4096}
  review: {timeout_s: 90, max_tokens: 2048}
  review_retry: {timeout_s: 90, max_tokens: 2048}
  revision: {timeout_s: 90, max_tokens: 4096}
  rereview: {timeout_s: 90, max_tokens: 2048}
  repair: {timeout_s: 150, max_tokens: 4096}
  first_tools_s: 120
  recheck_tools_s: 120
  max_calls: 7
  max_output_tokens: 65536
  submission_policy: last_written
runtime:
  deadline_s: 900
  reserve_s: 60
  recording: {level: full}
services:
  model:
    backend: openai
    base_url: http://127.0.0.1:8010/v1
    model: qwen38-27b-q4-k-m
    tokenizer_protocol: llama_cpp
    max_model_len: 65536
    timeout_s: 300
    structured_outputs: false
  profiles:
    small: {enabled: false, model: verireason-1.5b, base_url: http://127.0.0.1:8011/v1}
    large: {enabled: false}
