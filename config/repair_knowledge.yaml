# 冻结的通用时序 Skill；RAG 已与 Skill 分离，默认保持关闭。
# 单因素对照保留其它设置，只改 skill_ids: []。
workflow: repair_loop
params: {max_rounds: 2}
nodes:
  generate:
    use: rtl_generate
    params:
      max_tokens: 4096
      temperature: 0.2
      timeout_s: 180
      skill_ids: [rtl-sequential-state-update]
      skill_phases: [generate, repair]
      rag: false
      knowledge_max_tokens: 2048
  check: {use: rtl_checks, params: {stages: [interface, lint, synth]}}
tools:
  interface: {use: interface_check}
  lint: {use: vivado_lint, params: {timeout_s: 300}}
  synth: {use: vivado_synth, params: {timeout_s: 300}}
services:
  model: {backend: mock}
runtime:
  deadline_s: 900
  reserve_s: 20
  recording: {level: full}
